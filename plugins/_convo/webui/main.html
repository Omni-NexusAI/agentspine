<html><head><title>Convo</title><script type="module">
import { store, install } from '/plugins/_convo/webui/convo-store.js';
install();
</script></head><body><div x-data><template x-if="$store.convo"><section class="convo-panel" x-init="$store.convo.mountPanel()" x-destroy="$store.convo.unmountPanel()">
  <header class="convo-bar">
    <div class="convo-heading"><h2>Convo</h2><span class="convo-chip" :data-state="$store.convo.chipState" role="status" aria-live="polite"><span class="convo-dot" aria-hidden="true"></span><span x-text="$store.convo.statusLabel"></span><span class="convo-level" aria-hidden="true" x-show="$store.convo.live === 'hearing'" :style="'--level:' + $store.convo.liveLevel"><i></i></span></span></div>
    <div class="convo-tools">
      <button type="button" class="button convo-iconbtn convo-sound-button" @click="$store.convoSound?.toggle()" :aria-expanded="$store.convoSound?.open ? 'true' : 'false'" aria-controls="convo-sound-drawer" aria-label="Sound settings"><span class="material-symbols-outlined" aria-hidden="true">tune</span><span class="convo-iconlabel">Sound</span></button>
      <button type="button" class="button convo-iconbtn convo-studio-button" @click="$store.convo.openStudio()" aria-label="Open Voice Studio"><span class="material-symbols-outlined" aria-hidden="true">graphic_eq</span><span class="convo-iconlabel">Voice Studio</span></button>
      <button type="button" class="button convo-iconbtn convo-settings-button" @click="$store.convo.openSettingsModal()" aria-label="Convo settings" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="convo-iconlabel">Settings</span></button>
    </div>
  </header>
  <!-- The orb is the start and stop control. One element: it rests large on the ready page (.convo-orb-slot) and moves to its place
       beside the controls (.convo-orb-dock) when a conversation starts; convo-store.js placeOrb measures the two and the CSS animates. -->
  <button type="button" class="convo-primary convo-panel-orb" x-init="$store.convo.bindPanelOrb($el)" x-destroy="$store.convo.bindPanelOrb(null)" x-effect="$store.convo.active; $store.convo.busy; $store.convo.visibleEvents.length; $store.convo.draft; $store.convo.queuePlaceOrb()" :data-away="$store.convo.orbFloating && ($store.convo.active || $store.convo.busy) ? 'true' : 'false'" @click="$store.convo.active || $store.convo.busy ? $store.convo.stop() : $store.convo.toggle()" :disabled="$store.convo.settings?.ai_link_development_mode && !$store.convo.active && !$store.convo.busy"><span class="convo-orb-text" x-text="$store.convo.active || $store.convo.busy ? 'Stop conversation' : $store.convo.settings?.ai_link_development_mode ? 'Voice idle · development mode' : 'Start conversation'"></span></button>
  <div class="convo-controls convo-stage" :data-active="$store.convo.active || $store.convo.busy ? 'true' : 'false'" :data-rest="$store.convo.resting ? 'true' : 'false'">
    <span class="convo-orb-dock" aria-hidden="true"></span>
    <div class="convo-icons" role="group" aria-label="Conversation controls" :inert="!($store.convo.active || $store.convo.busy)">
      <button type="button" class="button convo-iconbtn convo-mute" style="--i:0" @click="$store.convo.toggleMute()" :aria-pressed="$store.convo.muted ? 'true' : 'false'" :aria-label="$store.convo.muted ? 'Unmute the microphone' : 'Mute the microphone'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.muted ? 'mic_off' : 'mic'"></span><span class="convo-iconlabel" x-text="$store.convo.muted ? 'Microphone muted' : 'Mute microphone'"></span></button>
      <button type="button" class="button convo-iconbtn convo-voice" style="--i:1" @click="$store.convo.toggleVoice()" :aria-pressed="$store.convo.voiceMuted ? 'true' : 'false'" :aria-label="$store.convo.voiceMuted ? 'Turn the assistant\u2019s voice on' : 'Silence the assistant\u2019s voice'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.voiceMuted ? 'volume_off' : 'volume_up'"></span><span class="convo-iconlabel" x-text="$store.convo.voiceMuted ? 'Voice off · text only' : 'Silence voice'"></span></button>
      <button type="button" class="button convo-iconbtn convo-camera" style="--i:2" @click="$store.convo.toggleCamera()" :aria-pressed="$store.convo.cameraShared ? 'true' : 'false'" :aria-label="$store.convo.cameraLabel"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.cameraShared ? 'videocam_off' : 'videocam'"></span><span class="convo-iconlabel" x-text="$store.convo.cameraLabel"></span></button>
      <button type="button" class="button convo-iconbtn convo-screen" style="--i:3" x-show="$store.convo.canShareScreen" @click="$store.convo.toggleScreen()" :aria-pressed="$store.convo.screenShared ? 'true' : 'false'" :aria-label="$store.convo.screenLabel"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.screenShared ? 'stop_screen_share' : 'screen_share'"></span><span class="convo-iconlabel" x-text="$store.convo.screenLabel"></span></button>
      <button type="button" class="button convo-iconbtn convo-floatbtn" style="--i:4" @click="$store.convo.toggleFloat()" :aria-pressed="$store.convo.orbFloating ? 'true' : 'false'" :aria-label="$store.convo.orbFloating ? 'Put the orb back here' : 'Let the orb float over the window'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.orbFloating ? 'close_fullscreen' : 'picture_in_picture'"></span><span class="convo-iconlabel" x-text="$store.convo.orbFloating ? 'Dock orb' : 'Float orb'"></span></button>
    </div>
  </div>
  <div class="convo-update" role="status" x-show="$store.convo.updateAvailable"><span>Convo was updated — Reload to use the new version</span><button type="button" class="button convo-link" @click="$store.convo.reloadPage()">Reload</button></div>
  <div class="convo-update convo-owner" role="status" x-show="$store.convo.ownerElsewhere || $store.convo.reconnecting || $store.convo.movedTo"><span x-text="$store.convo.reconnecting ? 'Connection lost — reconnecting to the conversation…' : $store.convo.ownerElsewhere ? $store.convo.ownerText : 'Voice moved to ' + $store.convo.movedTo + '.'"></span><button type="button" class="button convo-link" x-show="$store.convo.ownerElsewhere && !$store.convo.active && !$store.convo.busy" @click="$store.convo.takeOver()">Take over here</button></div>
  <div class="convo-drawer" id="convo-sound-drawer" x-show="$store.convoSound?.open"><x-component path="/plugins/_convo/webui/sound-panel.html"></x-component><x-component path="/plugins/_convo/webui/synthesis-controls.html"></x-component></div>
  <div class="convo-target"><span class="convo-target-name"><span x-text="$store.convo.targetPrefix"></span><strong x-text="$store.convo.targetLabel"></strong></span>
    <div class="convo-modes" x-show="$store.convo.target" role="group" aria-label="How Convo answers" @keydown.escape="$store.convo.closeMenu($event)">
      <div class="convo-menu-anchor" @click.outside="$store.convo.menu === 'reasoning' && $store.convo.closeMenu()">
        <button type="button" class="btn-icon-action convo-menu-btn" data-menu="reasoning" @click="$store.convo.toggleMenu('reasoning')" :aria-expanded="$store.convo.menu === 'reasoning' ? 'true' : 'false'" aria-haspopup="menu" aria-controls="convo-reasoning-menu" :aria-label="'Reasoning: ' + $store.convo.reasoningLabel" title="How much the conversation model thinks before it answers"><span class="material-symbols-outlined" aria-hidden="true">psychology</span><span class="convo-menu-label" x-text="$store.convo.reasoningLabel"></span><span class="material-symbols-outlined convo-menu-chevron" aria-hidden="true" x-text="$store.convo.menu === 'reasoning' ? 'expand_less' : 'expand_more'"></span></button>
        <div class="convo-menu" id="convo-reasoning-menu" role="menu" aria-label="Reasoning" x-show="$store.convo.menu === 'reasoning'" x-transition.opacity>
          <div class="convo-menu-head">Reasoning</div>
          <template x-for="item in $store.convo.reasoningItems" :key="item.id"><button type="button" role="menuitemradio" class="convo-menu-item" :class="{ active: item.on }" :aria-checked="item.on ? 'true' : 'false'" :aria-disabled="item.disabled ? 'true' : 'false'" :disabled="$store.convo.modesBusy" @click="$store.convo.setReasoning(item.id)"><span class="convo-menu-name"><span class="material-symbols-outlined convo-menu-check" aria-hidden="true" x-text="item.on ? 'check' : ''"></span><span x-text="item.label"></span></span><span class="convo-menu-note" x-show="item.note" x-text="item.note"></span></button></template>
          <p class="convo-menu-foot" x-show="$store.convo.reasoningNote" x-text="$store.convo.reasoningNote"></p>
        </div>
      </div>
      <div class="convo-menu-anchor" @click.outside="$store.convo.menu === 'permission' && $store.convo.closeMenu()">
        <button type="button" class="btn-icon-action convo-menu-btn" data-menu="permission" @click="$store.convo.toggleMenu('permission')" :aria-expanded="$store.convo.menu === 'permission' ? 'true' : 'false'" aria-haspopup="menu" aria-controls="convo-permission-menu" :aria-label="'Permissions: ' + $store.convo.permissionLabel" title="What Convo may start, change or save without asking"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.permissionIcon"></span><span class="convo-menu-label" x-text="$store.convo.permissionLabel"></span><span class="material-symbols-outlined convo-menu-chevron" aria-hidden="true" x-text="$store.convo.menu === 'permission' ? 'expand_less' : 'expand_more'"></span></button>
        <div class="convo-menu convo-menu-end" id="convo-permission-menu" role="menu" aria-label="Permissions" x-show="$store.convo.menu === 'permission'" x-transition.opacity>
          <div class="convo-menu-head">Permissions</div>
          <template x-for="item in $store.convo.permissionItems" :key="item.id"><button type="button" role="menuitemradio" class="convo-menu-item" :class="{ active: item.on }" :aria-checked="item.on ? 'true' : 'false'" :disabled="$store.convo.modesBusy || $store.convo.planBusy" @click="$store.convo.setPermission(item.id)"><span class="convo-menu-name"><span class="material-symbols-outlined convo-menu-check" aria-hidden="true" x-text="item.on ? 'check' : ''"></span><span x-text="item.label"></span></span><span class="convo-menu-note" x-text="item.note"></span></button></template>
          <template x-if="$store.convo.planning"><button type="button" role="menuitem" class="convo-menu-item convo-menu-extra" :disabled="$store.convo.planBusy" @click="$store.convo.newPlan()"><span class="convo-menu-name"><span class="material-symbols-outlined convo-menu-check" aria-hidden="true">add</span><span>Start a new plan</span></span><span class="convo-menu-note">The plan in hand is kept.</span></button></template>
          <template x-if="($store.convo.modes?.allowed || []).length"><div class="convo-menu-allowed"><div class="convo-menu-head">Not asked about any more</div><template x-for="item in $store.convo.modes.allowed" :key="item.tool"><div class="convo-menu-row"><span x-text="item.label"></span><button type="button" class="btn-icon-action convo-menu-forget" :disabled="$store.convo.modesBusy" @click="$store.convo.forgetAllowed(item.tool)" :aria-label="'Ask again before: ' + item.label" title="Ask again"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div></template></div></template>
          <p class="convo-menu-foot" x-show="$store.convo.modesNote" x-text="$store.convo.modesNote" role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="convo-preview" x-show="$store.convo.cameraShared || $store.convo.screenShared" :data-flash="$store.convo.previewFlash ? 'true' : 'false'" :style="$store.convo.previewStyle" @pointerdown="$store.convo.previewGrab($event, $el)" role="group" aria-label="What is being shared">
    <video class="convo-preview-video" muted playsinline autoplay x-effect="$store.convo.attachPreview($el, $store.convo.cameraShared, $store.convo.screenShared)"></video>
    <span class="convo-preview-tag" x-text="$store.convo.cameraShared && $store.convo.screenShared ? 'Camera · screen shared too' : $store.convo.screenShared ? 'Sharing screen' : 'Camera'"></span>
    <div class="convo-preview-tools">
      <button type="button" class="button convo-icon" x-show="$store.convo.cameraShared && $store.convo.screenShared" @click.stop="$store.convo.previewSwap()" aria-label="Show the other picture"><span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span></button>
      <button type="button" class="button convo-icon" x-show="$store.convo.canPopPreview" @click.stop="$store.convo.previewPop($el.closest('.convo-preview').querySelector('video'))" aria-label="Open the preview in its own window"><span class="material-symbols-outlined" aria-hidden="true">picture_in_picture_alt</span></button>
    </div>
  </div>
  <p class="convo-hint" x-show="$store.convo.hintText" x-text="$store.convo.hintText"></p>
  <button type="button" class="button convo-resume" x-show="$store.convo.audioPaused" @click="$store.convo.resumeAudio()"><span class="material-symbols-outlined" aria-hidden="true">volume_off</span>Audio paused — click to resume</button>
  <div class="convo-mic-issue" x-show="$store.convo.micIssue" :role="$store.convo.micIssue?.restart ? 'alert' : null"><p x-text="$store.convo.micIssue?.message || ''"></p><button type="button" class="button convo-resume" x-show="$store.convo.micIssue?.restart" @click="$store.convo.restartMicrophone()"><span class="material-symbols-outlined" aria-hidden="true">mic</span>Restart the microphone</button></div>
  <div class="convo-error-line" x-show="$store.convo.error"><p class="convo-error" :role="$store.convo.errorQuiet ? null : 'alert'" x-text="$store.convo.error"></p><button type="button" class="button convo-icon convo-dismiss" @click="$store.convo.dismissError()" aria-label="Dismiss this message"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
  <div class="convo-ask" role="group" aria-label="Convo asks before it goes ahead" x-show="$store.convo.pendingAction">
    <div class="convo-ask-text" role="status"><strong x-text="$store.convo.pendingAction?.label || ''"></strong><p x-show="$store.convo.pendingAction?.summary" x-text="$store.convo.pendingAction?.summary || ''"></p></div>
    <div class="convo-ask-buttons"><button type="button" class="button convo-primary" :disabled="$store.convo.pendingAction?.busy === true" @click="$store.convo.answerAction(true)" :aria-label="'Run: ' + ($store.convo.pendingAction?.label || '')">Run</button><button type="button" class="button" x-show="$store.convo.pendingAction?.always" :disabled="$store.convo.pendingAction?.busy === true" @click="$store.convo.answerAction(true, true)" :aria-label="'Run, and do not ask again: ' + ($store.convo.pendingAction?.label || '')" title="Runs it, and this kind of action is no longer asked about (the Permissions menu can take that back)">Always</button><button type="button" class="button" :disabled="$store.convo.pendingAction?.busy === true" @click="$store.convo.answerAction(false)" :aria-label="'Dismiss: ' + ($store.convo.pendingAction?.label || '')">Dismiss</button></div>
  </div>
  <ul class="convo-links" x-show="$store.convo.links.length" aria-label="Links to open"><template x-for="link in $store.convo.links" :key="link.id"><li><a class="button convo-link-open" :href="link.url" target="_blank" rel="noopener noreferrer" @click="$store.convo.linkTapped(link.id)"><span class="material-symbols-outlined" aria-hidden="true">open_in_new</span><span x-text="'Open ' + link.title"></span></a><button type="button" class="button convo-icon" @click="$store.convo.closeLink(link.id)" :aria-label="'Dismiss the link to ' + link.title"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></li></template></ul>
  <template x-for="item in $store.convo.planLost" :key="item.key"><div class="convo-plan-lost" role="status"><span x-text="'Your unsaved edit of ' + (item.topic ? '“' + item.topic + '”' : 'the plan') + ' could not be saved to it.'"></span><span class="convo-ask-buttons"><button type="button" class="button" @click="$store.convo.copyLost(item)">Copy it</button><button type="button" class="button" @click="$store.convo.dropLost(item)">Let it go</button></span></div></template>
  <section class="convo-plan" x-show="$store.convo.plan" aria-label="The plan of this conversation">
    <button type="button" class="button convo-plan-head" @click="$store.convo.planOpen = !$store.convo.planOpen" :aria-expanded="$store.convo.planOpen ? 'true' : 'false'" aria-controls="convo-plan-body"><span class="convo-plan-state" x-text="$store.convo.planState"></span><strong x-text="$store.convo.plan?.topic || 'Untitled plan'"></strong><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.planOpen ? 'expand_less' : 'expand_more'"></span></button>
    <div class="convo-plan-body" id="convo-plan-body" x-show="$store.convo.planOpen">
      <p class="convo-hint" x-show="$store.convo.planWaiting" x-text="$store.convo.planWaiting"></p>
      <textarea rows="8" maxlength="12000" aria-label="The plan, as text" placeholder="Convo keeps the plan up to date between replies. You can edit it here." :value="$store.convo.planText" @input="$store.convo.editPlan($event.target.value)"></textarea>
      <p class="convo-hint" role="status" x-show="$store.convo.planNote" x-text="$store.convo.planNote"></p>
      <div class="convo-ask-buttons">
        <button type="button" class="button convo-primary" x-show="$store.convo.planDirty && !$store.convo.planClash" :disabled="$store.convo.planBusy" @click="$store.convo.savePlan()">Save</button>
        <button type="button" class="button convo-primary" x-show="$store.convo.planClash" :disabled="$store.convo.planBusy" @click="$store.convo.savePlan({ mine: true })">Save mine</button>
        <button type="button" class="button" x-show="$store.convo.planDirty" :disabled="$store.convo.planBusy" @click="$store.convo.revertPlan()" x-text="$store.convo.planClash ? 'Use the new one' : 'Revert'"></button>
        <button type="button" class="button" x-show="$store.convo.planText.trim() && $store.convo.plan?.status !== 'handed'" :disabled="$store.convo.planBusy" @click="$store.convo.handOverPlan()" title="Gives the whole plan to the chat's agent as one task">Hand over</button>
        <button type="button" class="button" x-show="!$store.convo.planning" :disabled="$store.convo.planBusy" @click="$store.convo.goOnPlanning()" x-text="$store.convo.plan?.status === 'handed' ? 'New plan' : 'Go on planning'"></button>
        <button type="button" class="button" x-show="$store.convo.planText.trim()" @click="$store.convo.copyPlan()">Copy</button>
        <button type="button" class="button" x-show="!$store.convo.planning" :disabled="$store.convo.planBusy" @click="$store.convo.discardPlan()">Discard</button>
      </div>
      <button type="button" class="button convo-earlier-head" x-show="$store.convo.planVersions.length" @click="$store.convo.planVersionsOpen = !$store.convo.planVersionsOpen" :aria-expanded="$store.convo.planVersionsOpen ? 'true' : 'false'" aria-controls="convo-versions"><span>What stood here before</span><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.planVersionsOpen ? 'expand_less' : 'expand_more'"></span></button>
      <ul class="convo-plan-list" id="convo-versions" x-show="$store.convo.planVersionsOpen && $store.convo.planVersions.length" aria-label="What stood in this plan before"><template x-for="item in $store.convo.planVersions" :key="item.id"><li><span x-text="$store.convo.versionLabel(item)"></span><button type="button" class="button" :disabled="$store.convo.planBusy || $store.convo.planDirty" @click="$store.convo.putBack(item.id)" :aria-label="'Put back: ' + $store.convo.versionLabel(item)" title="Shows it in the field; Save keeps it">Put back</button></li></template></ul>
      <button type="button" class="button convo-earlier-head" x-show="$store.convo.planEarlier.length" @click="$store.convo.planEarlierOpen = !$store.convo.planEarlierOpen" :aria-expanded="$store.convo.planEarlierOpen ? 'true' : 'false'" aria-controls="convo-earlier"><span x-text="$store.convo.planEarlier.length === 1 ? 'One earlier plan' : $store.convo.planEarlier.length + ' earlier plans'"></span><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.planEarlierOpen ? 'expand_less' : 'expand_more'"></span></button>
      <ul class="convo-plan-list" id="convo-earlier" x-show="$store.convo.planEarlierOpen && $store.convo.planEarlier.length" aria-label="Plans kept earlier"><template x-for="item in $store.convo.planEarlier" :key="item.id"><li><span x-text="$store.convo.earlierLabel(item)"></span><button type="button" class="button" :disabled="$store.convo.planBusy" @click="$store.convo.openEarlier(item.id)" :aria-label="'Go on planning: ' + (item.topic || 'Untitled plan')" title="Goes on with that plan; the one shown is kept">Go on</button></li></template></ul>
    </div>
  </section>
  <ul class="convo-activity" x-show="$store.convo.activeJobs.length" aria-label="Background tasks in progress"><template x-for="job in $store.convo.activeJobs" :key="job.id"><li><span class="convo-activity-state" x-text="$store.convo.jobState(job)"></span><span class="convo-activity-text" x-text="job.prompt"></span><span class="convo-activity-chat" x-show="$store.convo.jobChat(job)" x-text="'in ' + $store.convo.jobChat(job)"></span><span class="convo-activity-change" role="status" x-show="$store.convo.changeState(job)" x-text="$store.convo.changeState(job)"></span><span class="convo-activity-buttons"><button type="button" class="button" x-show="['queued','running'].includes(job.status)" @click="$store.convo.cancelJob(job)">Cancel</button><button type="button" class="button" x-show="$store.convo.canSteer(job)" @click="$store.convo.openSteer(job)" :aria-expanded="$store.convo.steerOpen === job.id ? 'true' : 'false'" :title="$store.convo.steerHint(job)" x-text="$store.convo.steerLabel(job)"></button></span><form class="convo-steer" x-show="$store.convo.steerOpen === job.id && $store.convo.canSteer(job)" @submit.prevent="$store.convo.steerJob(job)"><input type="text" :value="$store.convo.steerText" @input="$store.convo.steerText = $event.target.value" maxlength="8000" placeholder="What should change?" aria-label="What should change about this task" @keydown.escape.stop.prevent="$store.convo.closeSteer()"><button type="submit" class="button" :disabled="$store.convo.steerBusy || !$store.convo.steerText.trim()">Send</button><button type="button" class="button" @click="$store.convo.closeSteer()">Close</button></form></li></template></ul>
  <div class="convo-log">
    <section class="convo-transcript" role="log" aria-live="off" aria-label="Voice conversation history" tabindex="0"
             x-init="$store.convo.bindTranscript($el)" x-destroy="$store.convo.unbindTranscript($el)" @scroll.passive="$store.convo.onScroll($el)"
             x-effect="$store.convo.visibleEvents.length; $store.convo.draft; $store.convo.queueSettle()">
      <button type="button" class="button convo-earlier" x-show="$store.convo.moreEarlier" :disabled="$store.convo.loadingEarlier" @click="$store.convo.loadEarlier()" x-text="$store.convo.loadingEarlier ? 'Loading…' : 'Load earlier messages'"></button>
      <div class="convo-empty" x-show="!$store.convo.visibleEvents.length && !$store.convo.draft"><span class="convo-orb-slot" aria-hidden="true" :data-open="$store.convo.active || $store.convo.busy ? 'false' : 'true'"></span><h3 x-text="$store.convo.active ? 'Go ahead, I\u2019m listening' : $store.convo.busy ? 'Starting\u2026' : 'Ready when you are'"></h3><p class="convo-empty-how" x-show="!($store.convo.active || $store.convo.busy)" x-text="$store.convo.settings?.ai_link_development_mode ? 'Voice is idle while AI Link development mode is on.' : 'Click the orb to start a conversation.'"></p><p class="convo-empty-how" x-show="!($store.convo.active || $store.convo.busy)">The orb beside the message box does the same; hold that one to dictate.</p><p><span x-show="!($store.convo.active || $store.convo.busy)">Connect your models with the settings button above.<br></span>Your voice history appears here; text chat stays separate.</p></div>
