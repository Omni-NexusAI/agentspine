<html><head><title>Convo</title><script type="module">
import { store, install } from '/plugins/_convo/webui/convo-store.js';
install();
</script></head><body><div x-data><template x-if="$store.convo"><section class="convo-panel" x-init="$store.convo.mountPanel()" x-destroy="$store.convo.unmountPanel()">
  <header class="convo-bar">
    <div class="convo-heading"><h2>Convo</h2><span class="convo-chip" :data-state="$store.convo.chipState" role="status" aria-live="polite"><span class="convo-dot" aria-hidden="true"></span><span x-text="$store.convo.statusLabel"></span><span class="convo-level" aria-hidden="true" x-show="$store.convo.live === 'hearing'" :style="'--level:' + $store.convo.liveLevel"><i></i></span></span></div>
    <div class="convo-tools">
      <button type="button" class="button convo-iconbtn convo-sound-button" @click="$store.convoSound?.toggle()" :aria-expanded="$store.convoSound?.open ? 'true' : 'false'" aria-controls="convo-sound-drawer" aria-label="Sound settings"><span class="material-symbols-outlined" aria-hidden="true">tune</span><span class="convo-iconlabel">Sound</span></button>
      <button type="button" class="button convo-iconbtn convo-studio-button" @click="$store.convo.openStudio()" aria-label="Open Voice Studio"><span class="material-symbols-outlined" aria-hidden="true">graphic_eq</span><span class="convo-iconlabel">Voice Studio</span></button>
      <button type="button" class="button convo-iconbtn convo-settings-button" @click="$store.convo.openSettingsModal()" aria-label="Convo settings" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">settings</span><span class="convo-iconlabel">Settings</span></button>
    </div>
  </header>
  <!-- The orb is the start and stop control. One element: it rests large on the ready page (.convo-orb-slot) and moves to its place
       beside the controls (.convo-orb-dock) when a conversation starts; convo-store.js placeOrb measures the two and the CSS animates. -->
  <button type="button" class="convo-primary convo-panel-orb" x-init="$store.convo.bindPanelOrb($el)" x-destroy="$store.convo.bindPanelOrb(null)" x-effect="$store.convo.active; $store.convo.busy; $store.convo.visibleEvents.length; $store.convo.draft; $store.convo.queuePlaceOrb()" :data-away="$store.convo.orbFloating && ($store.convo.active || $store.convo.busy) ? 'true' : 'false'" @click="$store.convo.active || $store.convo.busy ? $store.convo.stop() : $store.convo.toggle()" :disabled="$store.convo.settings?.ai_link_development_mode && !$store.convo.active && !$store.convo.busy"><span class="convo-orb-text" x-text="$store.convo.active || $store.convo.busy ? 'Stop conversation' : $store.convo.settings?.ai_link_development_mode ? 'Voice idle · development mode' : 'Start conversation'"></span></button>
  <div class="convo-controls convo-stage" :data-active="$store.convo.active || $store.convo.busy ? 'true' : 'false'" :data-rest="$store.convo.resting ? 'true' : 'false'">
    <span class="convo-orb-dock" aria-hidden="true"></span>
    <div class="convo-icons" role="group" aria-label="Conversation controls" :inert="!($store.convo.active || $store.convo.busy)">
      <button type="button" class="button convo-iconbtn convo-mute" style="--i:0" @click="$store.convo.toggleMute()" :aria-pressed="$store.convo.muted ? 'true' : 'false'" :aria-label="$store.convo.muted ? 'Unmute the microphone' : 'Mute the microphone'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.muted ? 'mic_off' : 'mic'"></span><span class="convo-iconlabel" x-text="$store.convo.muted ? 'Microphone muted' : 'Mute microphone'"></span></button>
      <button type="button" class="button convo-iconbtn convo-voice" style="--i:1" @click="$store.convo.toggleVoice()" :aria-pressed="$store.convo.voiceMuted ? 'true' : 'false'" :aria-label="$store.convo.voiceMuted ? 'Turn the assistant\u2019s voice on' : 'Silence the assistant\u2019s voice'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.voiceMuted ? 'volume_off' : 'volume_up'"></span><span class="convo-iconlabel" x-text="$store.convo.voiceMuted ? 'Voice off · text only' : 'Silence voice'"></span></button>
      <button type="button" class="button convo-iconbtn convo-camera" style="--i:2" @click="$store.convo.toggleCamera()" :aria-pressed="$store.convo.cameraShared ? 'true' : 'false'" :aria-label="$store.convo.cameraLabel"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.cameraShared ? 'videocam_off' : 'videocam'"></span><span class="convo-iconlabel" x-text="$store.convo.cameraLabel"></span></button>
      <button type="button" class="button convo-iconbtn convo-screen" style="--i:3" x-show="$store.convo.canShareScreen" @click="$store.convo.toggleScreen()" :aria-pressed="$store.convo.screenShared ? 'true' : 'false'" :aria-label="$store.convo.screenLabel"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.screenShared ? 'stop_screen_share' : 'screen_share'"></span><span class="convo-iconlabel" x-text="$store.convo.screenLabel"></span></button>
      <button type="button" class="button convo-iconbtn convo-floatbtn" style="--i:4" @click="$store.convo.toggleFloat()" :aria-pressed="$store.convo.orbFloating ? 'true' : 'false'" :aria-label="$store.convo.orbFloating ? 'Put the orb back here' : 'Let the orb float over the window'"><span class="material-symbols-outlined" aria-hidden="true" x-text="$store.convo.orbFloating ? 'close_fullscreen' : 'picture_in_picture'"></span><span class="convo-iconlabel" x-text="$store.convo.orbFloating ? 'Dock orb' : 'Float orb'"></span></button>
    </div>
  </div>
  <div class="convo-update" role="status" x-show="$store.convo.updateAvailable"><span>Convo was updated — Reload to use the new version</span><button type="button" class="button convo-link" @click="$store.convo.reloadPage()">Reload</button></div>
  <div class="convo-update convo-owner" role="status" x-show="$store.convo.ownerElsewhere || $store.convo.reconnecting || $store.convo.movedTo"><span x-text="$store.convo.reconnecting ? 'Connection lost — reconnecting to the conversation…' : $store.convo.ownerElsewhere ? $store.convo.ownerText : 'Voice moved to ' + $store.convo.movedTo + '.'"></span><button type="button" class="button convo-link" x-show="$store.convo.ownerElsewhere && !$store.convo.active && !$store.convo.busy" @click="$store.convo.takeOver()">Take over here</button></div>
  <div class="convo-drawer" id="convo-sound-drawer" x-show="$store.convoSound?.open"><x-component path="/plugins/_convo/webui/sound-panel.html"></x-component><x-component path="/plugins/_convo/webui/synthesis-controls.html"></x-component></div>
  <div class="convo-target"><span class="convo-target-name"><span x-text="$store.convo.targetPrefix"></span><strong x-text="$store.convo.targetLabel"></strong></span></div>
  <div class="convo-preview" x-show="$store.convo.cameraShared || $store.convo.screenShared" :data-flash="$store.convo.previewFlash ? 'true' : 'false'" :style="$store.convo.previewStyle" @pointerdown="$store.convo.previewGrab($event, $el)" role="group" aria-label="What is being shared">
    <video class="convo-preview-video" muted playsinline autoplay x-effect="$store.convo.attachPreview($el, $store.convo.cameraShared, $store.convo.screenShared)"></video>
    <span class="convo-preview-tag" x-text="$store.convo.cameraShared && $store.convo.screenShared ? 'Camera · screen shared too' : $store.convo.screenShared ? 'Sharing screen' : 'Camera'"></span>
    <div class="convo-preview-tools">
      <button type="button" class="button convo-icon" x-show="$store.convo.cameraShared && $store.convo.screenShared" @click.stop="$store.convo.previewSwap()" aria-label="Show the other picture"><span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span></button>
      <button type="button" class="button convo-icon" x-show="$store.convo.canPopPreview" @click.stop="$store.convo.previewPop($el.closest('.convo-preview').querySelector('video'))" aria-label="Open the preview in its own window"><span class="material-symbols-outlined" aria-hidden="true">picture_in_picture_alt</span></button>
    </div>
  </div>
  <p class="convo-hint" x-show="$store.convo.hintText" x-text="$store.convo.hintText"></p>
  <button type="button" class="button convo-resume" x-show="$store.convo.audioPaused" @click="$store.convo.resumeAudio()"><span class="material-symbols-outlined" aria-hidden="true">volume_off</span>Audio paused — click to resume</button>
  <div class="convo-mic-issue" x-show="$store.convo.micIssue" :role="$store.convo.micIssue?.restart ? 'alert' : null"><p x-text="$store.convo.micIssue?.message || ''"></p><button type="button" class="button convo-resume" x-show="$store.convo.micIssue?.restart" @click="$store.convo.restartMicrophone()"><span class="material-symbols-outlined" aria-hidden="true">mic</span>Restart the microphone</button></div>
  <div class="convo-error-line" x-show="$store.convo.error"><p class="convo-error" :role="$store.convo.errorQuiet ? null : 'alert'" x-text="$store.convo.error"></p><button type="button" class="button convo-icon convo-dismiss" @click="$store.convo.dismissError()" aria-label="Dismiss this message"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
  <div class="convo-ask" role="group" aria-label="Convo asks before it goes ahead" x-show="$store.convo.pendingAction">
    <div class="convo-ask-text" role="status"><strong x-text="$store.convo.pendingAction?.label || ''"></strong><p x-show="$store.convo.pendingAction?.summary" x-text="$store.convo.pendingAction?.summary || ''"></p></div>
    <div class="convo-ask-buttons"><button type="button" class="button convo-primary" :disabled="$store.convo.pendingAction?.busy === true" @click="$store.convo.answerAction(true)" :aria-label="'Run: ' + ($store.convo.pendingAction?.label || '')">Run</button><button type="button" class="button" :disabled="$store.convo.pendingAction?.busy === true" @click="$store.convo.answerAction(false)" :aria-label="'Dismiss: ' + ($store.convo.pendingAction?.label || '')">Dismiss</button></div>
  </div>
  <ul class="convo-links" x-show="$store.convo.links.length" aria-label="Links to open"><template x-for="link in $store.convo.links" :key="link.id"><li><a class="button convo-link-open" :href="link.url" target="_blank" rel="noopener noreferrer" @click="$store.convo.linkTapped(link.id)"><span class="material-symbols-outlined" aria-hidden="true">open_in_new</span><span x-text="'Open ' + link.title"></span></a><button type="button" class="button convo-icon" @click="$store.convo.closeLink(link.id)" :aria-label="'Dismiss the link to ' + link.title"><span class="material-symbols-outlined" aria-hidden="true">close</span></button></li></template></ul>
  <ul class="convo-activity" x-show="$store.convo.activeJobs.length" aria-label="Background tasks in progress"><template x-for="job in $store.convo.activeJobs" :key="job.id"><li><span class="convo-activity-state" x-text="job.status.replaceAll('_', ' ')"></span><span class="convo-activity-text" x-text="job.prompt"></span><span class="convo-activity-chat" x-show="$store.convo.jobChat(job)" x-text="'in ' + $store.convo.jobChat(job)"></span><span class="convo-activity-buttons"><button type="button" class="button" x-show="['queued','running'].includes(job.status)" @click="$store.convo.cancelJob(job)">Cancel</button><button type="button" class="button" x-show="job.status === 'running'" @click="$store.convo.steerJob(job)" title="Send an explicit instruction to this running task">Steer</button></span></li></template></ul>
  <div class="convo-log">
    <section class="convo-transcript" role="log" aria-live="off" aria-label="Voice conversation history" tabindex="0"
             x-init="$store.convo.bindTranscript($el)" x-destroy="$store.convo.unbindTranscript($el)" @scroll.passive="$store.convo.onScroll($el)"
             x-effect="$store.convo.visibleEvents.length; $store.convo.draft; $store.convo.queueSettle()">
      <button type="button" class="button convo-earlier" x-show="$store.convo.moreEarlier" :disabled="$store.convo.loadingEarlier" @click="$store.convo.loadEarlier()" x-text="$store.convo.loadingEarlier ? 'Loading…' : 'Load earlier messages'"></button>
      <div class="convo-empty" x-show="!$store.convo.visibleEvents.length && !$store.convo.draft"><span class="convo-orb-slot" aria-hidden="true" :data-open="$store.convo.active || $store.convo.busy ? 'false' : 'true'"></span><h3 x-text="$store.convo.active ? 'Go ahead, I\u2019m listening' : $store.convo.busy ? 'Starting\u2026' : 'Ready when you are'"></h3><p class="convo-empty-how" x-show="!($store.convo.active || $store.convo.busy)" x-text="$store.convo.settings?.ai_link_development_mode ? 'Voice is idle while AI Link development mode is on.' : 'Click the orb to start a conversation.'"></p><p class="convo-empty-how" x-show="!($store.convo.active || $store.convo.busy)">The orb beside the message box does the same; hold that one to dictate.</p><p><span x-show="!($store.convo.active || $store.convo.busy)">Connect your models with the settings button above.<br></span>Your voice history appears here; text chat stays separate.</p></div>
      <template x-for="event in $store.convo.visibleEvents" :key="event.key ?? event.seq"><article class="convo-message" :data-role="$store.convo.eventRole(event)" :data-faint="event.faint ? '' : null"><header x-text="$store.convo.eventLabel(event)"></header><div x-show="$store.convo.eventText(event)" x-text="$store.convo.eventText(event)"></div><p class="convo-detail" x-show="$store.convo.eventDetail(event)" x-text="$store.convo.eventDetail(event)"></p></article></template>
      <article class="convo-message" data-role="assistant" x-show="$store.convo.draft" aria-live="off"><header>Draft · not yet delivered</header><div x-text="$store.convo.draftText"></div></article>
    </section>
    <!-- Outside the scroller on purpose: inside it, showing the button would lengthen the content and move the reader away from the end. -->
    <button type="button" class="button convo-latest" x-show="!$store.convo.pinned" @click="$store.convo.jumpToLatest()"><span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span><span x-text="$store.convo.unseen ? $store.convo.unseen + ' new · latest' : 'Jump to latest'"></span></button>
  </div>
</section></template></div>
<style>
.convo-panel{display:flex;flex-direction:column;gap:.55rem;padding:.75rem;box-sizing:border-box;min-width:0;width:100%;height:100%;min-height:320px;overflow:hidden;color:var(--color-text);font:inherit}
.modal-bd .convo-panel{height:min(78vh,720px)}
.convo-panel>*{min-width:0;flex-shrink:0}
.convo-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.convo-heading{display:flex;align-items:center;gap:.6rem;min-width:0;flex-wrap:wrap}
.convo-heading h2{margin:0;font-size:1.1rem;letter-spacing:-.02em}
.convo-chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;padding:.12rem .55rem;border:1px solid var(--color-border);border-radius:999px;opacity:.9}
.convo-dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;opacity:.45}
.convo-chip[data-state=listening] .convo-dot{background:#69bdca;opacity:1}.convo-chip[data-state=speaking] .convo-dot{background:#aaa0d3;opacity:1}
.convo-chip[data-state=considering] .convo-dot,.convo-chip[data-state=thinking] .convo-dot,.convo-chip[data-state=connecting] .convo-dot{background:#c8aa72;opacity:1}
.convo-chip[data-state=dictation] .convo-dot{background:#7fc08b;opacity:1}.convo-chip[data-state=error] .convo-dot{background:var(--color-error,#da6868);opacity:1}
.convo-chip[data-state=muted] .convo-dot{background:transparent;border:2px solid currentColor;box-sizing:border-box;opacity:.9}
.convo-chip[data-state=loading] .convo-dot,.convo-chip[data-state=activity] .convo-dot{background:#c8aa72;opacity:1}
/* hearing you: the dot pulses and a small bar follows the microphone level (both aria-hidden; the words are the label) */
.convo-chip[data-state=hearing] .convo-dot{background:#69bdca;opacity:1;animation:convo-pulse 1.1s ease-in-out infinite}
.convo-level{display:inline-block;width:2rem;height:.3rem;border-radius:2px;background:var(--color-border);overflow:hidden}
.convo-level>i{display:block;height:100%;background:#69bdca;transform-origin:left center;transform:scaleX(var(--level,0));transition:transform .08s linear}
@keyframes convo-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.55}}
.convo-tools{display:flex;gap:.35rem;flex-shrink:0}
.convo-update{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.8rem;border:1px solid var(--color-border);border-left:3px solid var(--color-text);border-radius:8px;padding:.35rem .6rem}
.convo-panel .button{min-height:36px;white-space:normal;gap:.35rem}
.convo-panel .convo-icon{min-width:36px;padding:.25rem .5rem;display:inline-flex;align-items:center;justify-content:center}
.convo-panel .convo-icon .material-symbols-outlined{font-size:1.25rem}
.convo-target{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.8rem}
.convo-target-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo-panel .convo-link{min-height:30px;padding:.15rem .6rem;font-size:.75rem}
.convo-controls{display:flex;flex-wrap:wrap;gap:.5rem}
/* The orb is the start and stop control: the standalone interface's orb (webui/orb.js FULL; its layers are styled in
   extensions/webui/page-head/zz-convo-orb.html). It is one absolutely placed element: convo-store.js placeOrb gives it the box of
   .convo-orb-slot (the ready page) or .convo-orb-dock (beside the controls), and the move between the two is animated here.
   `data-still` is set while it only follows a resize, so it never lags behind the layout. */
.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary{position:absolute;z-index:4;left:0;top:0;width:46px;height:46px;border:0;border-radius:50%;background:transparent;padding:0;margin:0;min-height:0;cursor:pointer;color:inherit;transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1),width .6s cubic-bezier(.5,0,.2,1),height .6s cubic-bezier(.5,0,.2,1),transform .18s ease,filter .18s ease,opacity .25s ease}
.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary[data-still]{transition:transform .18s ease,filter .18s ease,opacity .25s ease}
.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary:not([data-place]){opacity:0}
.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary[data-away=true]{opacity:0;transform:scale(.3);pointer-events:none}
.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary:disabled{opacity:.45;cursor:not-allowed}
.convo-panel .convo-panel-orb:not([data-convo]){border:2px solid var(--color-border)}
.convo-orb-text{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.convo-stage{align-items:center;justify-content:flex-start;flex-wrap:nowrap;gap:.6rem;min-height:46px}
.convo-stage[data-rest=true]{height:0;min-height:0;margin-bottom:-.55rem;overflow:hidden}
.convo-orb-dock{flex:0 0 46px;width:46px;height:46px}
.convo-orb-slot{display:block;width:clamp(104px,36%,148px);aspect-ratio:1;margin:0 auto .9rem}
.convo-orb-slot[data-open=false]{display:none}
.convo-icons{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;min-width:0}
.convo-panel .convo-iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:0;min-width:38px;height:38px;padding:0 .55rem;border-radius:19px}
.convo-panel .convo-iconbtn .material-symbols-outlined{font-size:1.25rem}
.convo-iconbtn .convo-iconlabel{display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;opacity:0;margin-left:0;font-size:.8rem;transition:max-width .22s ease,opacity .22s ease,margin-left .22s ease}
.convo-iconbtn:hover .convo-iconlabel,.convo-iconbtn:focus-visible .convo-iconlabel{max-width:14rem;opacity:1;margin-left:.35rem}
.convo-panel .convo-iconbtn[aria-pressed=true],.convo-panel .convo-iconbtn[aria-expanded=true]{border-color:var(--color-text);background:var(--color-highlight,var(--color-panel))}
/* Muted is the one state that must be seen at a glance: red, with the struck-through microphone. */
.convo-panel .convo-mute[aria-pressed=true]{border-color:#e06c6c;background:color-mix(in srgb,#e06c6c 26%,transparent)}
.convo-panel .convo-mute[aria-pressed=true] .material-symbols-outlined{color:#e06c6c}
/* Before a conversation the controls are tucked behind the orb; when it starts, the orb travels to its place and they slide out
   of its right side one after another. */
.convo-stage .convo-iconbtn{opacity:0;transform:translateX(calc(-50px - var(--i,0)*42px)) scale(.4);pointer-events:none;transition:transform .25s ease,opacity .18s ease,background-color .15s ease,border-color .15s ease}
.convo-stage[data-active=true] .convo-iconbtn{opacity:1;transform:none;pointer-events:auto;transition:transform .5s cubic-bezier(.2,.9,.25,1.15) calc(.42s + var(--i,0)*.07s),opacity .3s ease calc(.42s + var(--i,0)*.07s),background-color .15s ease,border-color .15s ease}
/* What is being shared, small, in the panel's lower corner: dragged anywhere inside the panel, opened as its own window on request.
   The frame lights up for a moment each time the assistant actually takes a picture. */
.convo-panel{position:relative}
.convo-preview{position:absolute;right:.75rem;bottom:.75rem;z-index:3;width:168px;border:1px solid var(--color-border);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:grab;touch-action:none;transition:box-shadow .2s ease,border-color .2s ease}
.convo-preview[data-flash=true]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 4px 14px rgba(0,0,0,.35)}
.convo-preview-video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;pointer-events:none}
.convo-preview-tag{position:absolute;left:.35rem;top:.3rem;padding:.05rem .4rem;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem}
.convo-preview-tools{position:absolute;right:.25rem;bottom:.25rem;display:flex;gap:.2rem}
.convo-preview-tools .convo-icon{background:rgba(0,0,0,.6);color:#fff;border-color:transparent;min-width:30px;height:30px;padding:0 .3rem}
@media (prefers-reduced-motion:reduce){.convo-panel :is(#convo-orb-full,.convo-panel-orb).convo-primary,.convo-stage .convo-iconbtn,.convo-stage[data-active=true] .convo-iconbtn,.convo-iconbtn .convo-iconlabel,.convo-preview{transition:none}}
.convo-panel .convo-primary{background:var(--color-highlight,var(--color-panel));border-color:var(--color-text);color:#fff}
.convo-panel .convo-primary:disabled{background:transparent;border-color:var(--color-border);color:var(--color-text);opacity:.5;cursor:not-allowed}
.convo-panel .convo-hint{font-size:.75rem;line-height:1.4;opacity:.65;margin:0}
.convo-error-line{display:flex;align-items:flex-start;gap:.4rem}.convo-error-line .convo-error{flex:1 1 auto;min-width:0}
.convo-panel .convo-dismiss{min-height:28px;min-width:28px;padding:.1rem .3rem;flex-shrink:0}.convo-panel .convo-dismiss .material-symbols-outlined{font-size:1rem}
