<html><head><script type="module">import { store } from '/plugins/_convo/webui/setup-store.js';</script></head><body>
<div x-data><template x-if="$store.convoSetup?.config"><section class="convo-settings" @input="$store.convoSetup.message = ''">
  <nav class="convo-tabs" aria-label="Convo settings sections"><template x-for="section in $store.convoSetup.sections" :key="section"><button type="button" class="button" :aria-pressed="$store.convoSetup.section === section" @click="$store.convoSetup.section = section" x-text="section"></button></template></nav>
  <x-component path="/plugins/_convo/webui/settings-banner.html"></x-component>
  <div x-show="$store.convoSetup.section === 'Connections'" class="convo-stack">
    <x-component path="/plugins/_convo/webui/conversation-model-field.html"></x-component>
    <x-component path="/plugins/_convo/webui/classifier-model-field.html"></x-component>
    <x-component path="/plugins/_convo/webui/speech-output-field.html"></x-component>
  </div>
  <div x-show="$store.convoSetup.section === 'Conversation'" class="convo-stack">
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Enable Convo composer control</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.enabled" aria-label="Enable Convo composer control"><span class="toggler"></span></label></div></div>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Remember what you said (Whisper transcripts)</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.transcription_enabled" aria-label="Remember what you said (Whisper transcripts)"><span class="toggler"></span></label></div></div>
    <p class="convo-hint">Whisper writes down each answered turn, so the conversation model sees your words in later turns (and the history shows them).</p>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Allow ambient and name-activated listening</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.ambient_enabled" aria-label="Allow ambient and name-activated listening"><span class="toggler"></span></label></div></div>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Allow continuous ambient processing by remote providers</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.remote_ambient_consent" aria-label="Allow continuous ambient processing by remote providers"><span class="toggler"></span></label></div></div>
    <p class="convo-hint">Ambient mode is opt-in. Unrelated speech is not stored. No automatic provider fallback.</p>
    <label>Activation names, one per line<textarea :value="$store.convoSetup.config.activation_names.join('\n')" @change="$store.convoSetup.config.activation_names = $event.target.value.split('\n').map(s => s.trim()).filter(Boolean)" rows="2"></textarea></label>
    <label>Personality and speaking style<textarea x-model="$store.convoSetup.config.style" rows="4" maxlength="1600"></textarea></label>
    <p class="convo-hint">Extends your agent’s persona without changing permissions or delegation rules.</p>
    <label>Agent profile<select x-model="$store.convoSetup.config.voice_profile"><option value="" :selected="!$store.convoSetup.config.voice_profile">Same as the chat</option><template x-for="item in ($store.convoSetup.profiles || [])" :key="item.id"><option :value="item.id" :selected="item.id === $store.convoSetup.config.voice_profile" x-text="item.title || item.id"></option></template></select></label>
    <p class="convo-hint">The agent profile whose persona and name the voice uses. “Same as the chat” follows the selected chat.</p>
    <label>Answer length<select x-model="$store.convoSetup.config.response_detail"><template x-for="option in [['concise','Concise: the headline first'],['balanced','Balanced'],['detailed','Detailed: reasons and specifics']]" :key="option[0]"><option :value="option[0]" :selected="option[0] === $store.convoSetup.config.response_detail" x-text="option[1]"></option></template></select></label>
    <label>Spoken task updates<select x-model="$store.convoSetup.config.spoken_updates"><template x-for="option in [['completion','Only when a task finishes'],['milestones','Meaningful results and blockers'],['frequent','Short progress updates']]" :key="option[0]"><option :value="option[0]" :selected="option[0] === $store.convoSetup.config.spoken_updates" x-text="option[1]"></option></template></select></label>
    <p class="convo-hint">Defaults for how much Convo says, separate from personality. Saying “briefly”, “in detail” or “just the headline” changes only that one answer. Errors, permission requests and decisions you must make are always spoken. Answer length applies from the next response; the personality is read when a conversation starts or you change its chat. Routine progress stays visible as text without being spoken. Agent Zero currently reports a delegated task to Convo only when it finishes, fails or is left unconfirmed, so the other two levels only change what happens once it reports milestones or progress.</p>
    <x-component path="/plugins/_convo/webui/hotkeys-field.html"></x-component>
    <fieldset class="convo-card convo-voice-tools" x-init="$store.convoSetup.searchHealthShown($store.convoSetup.section); $watch('$store.convoSetup.section', section => $store.convoSetup.searchHealthShown(section))"><legend>What the voice agent may do</legend>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Search the web and read pages</div><div class="field-description">Looks things up with Agent Zero’s search service and opens a public page to read it.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.web" aria-label="Search the web and read pages"><span class="toggler"></span></label></div></div>
      <div class="convo-search-health"><p class="convo-hint" role="status" x-text="$store.convoSetup.searchHealthText()"></p><button type="button" class="button" :disabled="$store.convoSetup?.ui?.voiceTools?.busy === true" @click="$store.convoSetup.searchCheck()" x-text="$store.convoSetup?.ui?.voiceTools?.busy === true ? 'Checking…' : 'Check search'"></button></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Use long-term memory</div><div class="field-description">Reads what the agent remembers; saving something new always asks you first.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.memory" aria-label="Use long-term memory"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Hand over and manage tasks</div><div class="field-description">Hands longer work to the chat’s agent, reports how it is going and cancels it on request.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.tasks" aria-label="Hand over and manage tasks"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Check the system and the time</div><div class="field-description">Reads the machine’s load, memory, disk and services, and the time anywhere.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.system" aria-label="Check the system and the time"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Set timers and reminders</div><div class="field-description">Kept by Convo; you get a notification, and it is said aloud while voice is running.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.timers" aria-label="Set timers and reminders"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Look at your chats</div><div class="field-description">Lists your chats and reads a chat’s latest messages.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.chats" aria-label="Look at your chats"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">See and listen back</div><div class="field-description">Camera and screen pictures you share with a button, and replaying the last sounds it heard.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.senses" aria-label="See and listen back"><span class="toggler"></span></label></div></div>
      <div class="field convo-switch"><div class="field-label"><div class="field-title">Open things and change voice settings</div><div class="field-description">Opens a chat, Settings, the file browser or a link, and speaks slower or faster for this conversation.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.voice_tools.interface" aria-label="Open things and change voice settings"><span class="toggler"></span></label></div></div>
      <label>Look at the project’s files<select x-model="$store.convoSetup.config.project_files"><template x-for="option in [['local','While it stays on my own machines'],['on','Always'],['off','Never']]" :key="option[0]"><option :value="option[0]" :selected="option[0] === $store.convoSetup.config.project_files" x-text="option[1]"></option></template></select></label>
      <p class="convo-hint">Lists, reads and searches the files of the chat’s project or work folder; nothing is changed. Files and lines that look as if they held keys or passwords are left out; a secret that looks like ordinary text cannot be recognised. What it reads goes to the conversation model and into this conversation’s memory: “on my own machines” needs the conversation model, Convo’s gateway and whoever writes the summaries to run there.</p>
    </fieldset>
  </div>
  <div x-show="$store.convoSetup.section === 'Audio & Video'" class="convo-stack">
    <x-component path="/plugins/_convo/webui/speech-voice-field.html"></x-component>
    <x-component path="/plugins/_convo/webui/sound-panel.html"></x-component>
    <x-component path="/plugins/_convo/webui/dictation-field.html"></x-component>
  </div>
  <div x-show="$store.convoSetup.section === 'Advanced'" class="convo-stack">
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Developer mode</div><div class="field-description">Shows the diagnostics panel, with the developer settings and what the voice agent is doing.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.developer_mode" aria-label="Developer mode"><span class="toggler"></span></label></div></div>
    <div class="convo-advanced-open"><button type="button" class="button" x-show="$store.convoDiagnostics?.available" @click="$store.convoDiagnostics?.open()">Open diagnostics</button></div>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Show diagnostic events in the history</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.show_diagnostic_events" aria-label="Show diagnostic events in the history"><span class="toggler"></span></label></div></div>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Show replies that were never delivered</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.show_rejected_responses" aria-label="Show replies that were never delivered"><span class="toggler"></span></label></div></div>
    <p class="convo-hint">The two history options apply only in developer mode.</p>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">AI Link development mode</div><div class="field-description">Keeps Convo’s browser voice idle while AI Link uses the existing native speech providers. End any active Convo session before saving this; leaving it does not resume capture automatically.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" x-model="$store.convoSetup.config.ai_link_development_mode" aria-label="AI Link development mode"><span class="toggler"></span></label></div></div>
    <div class="field convo-switch"><div class="field-label"><div class="field-title">Keep one voice conversation for all chats</div><div class="field-description">Off: each chat has its own voice conversation, and its work goes to whichever chat you open. On: one conversation and one memory, whichever chat is open.</div></div><div class="field-control"><label class="toggle"><input type="checkbox" :checked="$store.convoSetup.config.conversation_scope === 'global'" @change="$store.convoSetup.config.conversation_scope = $event.target.checked ? 'global' : 'chat'" aria-label="Keep one voice conversation for all chats"><span class="toggler"></span></label></div></div>
    <label x-show="$store.convoSetup.config.conversation_scope === 'global'">Tasks with no chat named<select x-model="$store.convoSetup.config.task_chat"><template x-for="option in [['new','Open a new chat'],['selected','Use the selected chat']]" :key="option[0]"><option :value="option[0]" :selected="option[0] === $store.convoSetup.config.task_chat" x-text="option[1]"></option></template></select></label>
    <p class="convo-hint" x-show="$store.convoSetup.config.conversation_scope === 'global'">A new chat is reused for the later tasks of the same voice session. Voice started with no chat selected is always the one conversation for all chats.</p>
    <label x-show="$store.convoSetup.config.voice_name || $store.convoSetup.spokenNameKept" x-init="$store.convoSetup.spokenNameKept = !!$store.convoSetup.config.voice_name">Spoken name (set earlier)<input type="text" maxlength="64" x-model="$store.convoSetup.config.voice_name" :placeholder="($store.convoSetup.profiles || []).find(item => item.id === $store.convoSetup.config.voice_profile)?.title || 'The chat profile’s title'"></label>
    <p class="convo-hint" x-show="$store.convoSetup.config.voice_name || $store.convoSetup.spokenNameKept">The voice agent is called by its agent profile’s name. This older setting overrides it; clear it to use the profile’s name.</p>
  </div>
  <p role="alert" class="convo-error" x-show="$store.convoSetup.error" x-text="$store.convoSetup.error"></p><p role="status" class="convo-hint" x-show="$store.convoSetup.message" x-text="$store.convoSetup.message"></p>
  <footer class="convo-actions"><button class="button" :disabled="!$store.convoSetup.dirty || $store.convoSetup.busy" @click="$store.convoSetup.save()" x-text="$store.convoSetup.busy ? 'Saving…' : 'Save changes'"></button><button class="button" @click="$store.convoSetup.load(true)">Reload saved</button><small x-show="$store.convoSetup.dirty">Unsaved changes</small></footer>
</section></template></div>
<style>
.convo-settings,.convo-stack{display:flex;flex-direction:column;gap:1rem;min-width:0}.convo-settings{width:100%;color:var(--color-text);font:inherit}.convo-tabs,.convo-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}.convo-tabs .button[aria-pressed=true]{background:var(--color-highlight,var(--color-panel));border-color:var(--color-text)}.convo-settings label{display:flex;flex-direction:column;gap:.4rem;min-width:0;font-size:.9rem}.convo-settings input:not([type=checkbox]),.convo-settings select,.convo-settings textarea{box-sizing:border-box;width:100%;min-width:0;min-height:40px;background:var(--color-input,var(--color-background));color:var(--color-text);border:1px solid var(--color-border);border-radius:8px;padding:.55rem .65rem;font:inherit}.convo-settings .convo-check{flex-direction:row;align-items:flex-start;gap:.6rem}.convo-check input{margin-top:.25rem}.convo-check small{display:block;overflow-wrap:anywhere}.convo-card{border:1px solid var(--color-border);border-radius:12px;padding:1rem;min-width:0;display:flex;flex-direction:column;gap:.8rem;background:var(--color-panel)}.convo-card legend{padding:0 .35rem;font-weight:600}.convo-card>h4{margin:0}.convo-hint{color:var(--color-text);font-size:.875rem;line-height:1.4;opacity:.8;margin:.15rem 0;overflow-wrap:anywhere}.convo-settings summary{cursor:pointer;padding:.5rem 0}.convo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem}.convo-error{color:var(--color-error,#da6868);overflow-wrap:anywhere}.convo-facts{display:grid;grid-template-columns:max-content 1fr;gap:.25rem .9rem;margin:0;font-size:.88rem}.convo-facts dt{opacity:.7}.convo-facts dd{margin:0;overflow-wrap:anywhere}.convo-banner{border:1px solid var(--color-border);border-left:3px solid #c8aa72;border-radius:10px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.5rem;background:var(--color-panel)}.convo-conflict{display:flex;flex-direction:column;gap:.3rem;padding:.4rem 0;border-top:1px solid var(--color-border)}.convo-conflict code{font-size:.8rem;overflow-wrap:anywhere}.convo-conflict small{opacity:.75;overflow-wrap:anywhere}.convo-reasons{margin:0;padding-left:1.1rem;font-size:.82rem;line-height:1.5}.convo-decider summary small{opacity:.7;margin-left:.4rem}.convo-settings .button{min-height:40px;white-space:normal}.convo-settings :focus-visible{outline:2px solid var(--color-text);outline-offset:2px}@media(max-width:600px){.convo-settings .button,.convo-settings select{min-height:44px}.convo-card{padding:.75rem}.convo-tabs .button{flex:1 1 40%}}
/* Cards are x-components: the wrapper takes no box, so each card lays out exactly as if it were written here. */
.convo-settings x-component{display:contents}
.convo-voice-tools small{margin-top:.15rem;font-size:.82rem;line-height:1.4;opacity:.8}.convo-search-health{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;margin:-.3rem 0 0 1.6rem}.convo-search-health .convo-hint{flex:1 1 12rem;margin:0}
.convo-settings .convo-switch{align-items:center;margin:0}.convo-settings .convo-switch .field-control{display:flex;justify-content:flex-start}.convo-settings .convo-switch label.toggle{display:inline-block;flex:none}.convo-settings .convo-switch input:focus-visible + .toggler{outline:2px solid var(--color-primary);outline-offset:2px}.convo-advanced-open{display:flex;justify-content:flex-end}
</style></body></html>
