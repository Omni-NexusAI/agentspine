<html><head><title>Convo Voice Studio</title></head><body>
<script type="module">import { studio } from '/plugins/_convo/webui/studio-store.js?v=20260911-ready';</script>
<div x-data><template x-if="$store.convoStudio">
<section class="convo-studio-shell" x-data="{ destroy() { $store.convoStudio.close(); } }" x-init="$store.convoStudio.open()">
  <header><button class="btn" @click="$store.convoStudio.back()">← Back to Convo</button><h2>Voice Studio</h2></header>
  <p>One profile library and one saved response voice across Convo and Studio. Model connections remain in Convo settings.</p>
  <div class="convo-studio-selection"><label>Convo response voice<select x-model="$store.convoStudio.selectedVoice"><option value="">Choose a saved Base clone</option><template x-if="$store.convoStudio.savedVoiceUnavailable"><option :value="$store.convoStudio.selectedVoice" x-text="$store.convoStudio.selectedVoice + ' (saved; unavailable in managed Studio)'"></option></template><template x-for="voice in $store.convoStudio.profiles" :key="voice.id"><option :value="voice.voice" x-text="voice.name"></option></template></select></label>
  <button class="btn" @click="$store.convoStudio.refresh()" :disabled="$store.convoStudio.busy">Refresh voices</button><button class="btn btn-primary" @click="$store.convoStudio.useVoice()" :disabled="$store.convoStudio.busy || !$store.convoStudio.selectedVoiceAvailable">Use in Convo</button></div>
  <p role="status" x-text="$store.convoStudio.message"></p><p role="alert" x-text="$store.convoStudio.error"></p>
  <template x-if="$store.convoStudio.available && !$store.convoStudio.blocked"><iframe title="Convo-owned original Voice Studio" :src="$store.convoStudio.frameUrl" class="convo-studio-frame" referrerpolicy="same-origin" sandbox="allow-scripts allow-same-origin allow-downloads" allow="microphone 'none'; camera 'none'; autoplay 'none'"></iframe></template>
  <template x-if="!$store.convoStudio.available || $store.convoStudio.blocked"><div class="convo-studio-unavailable"><h3 x-text="$store.convoStudio.blocked ? 'Conversation is active' : 'Expanded Studio is not ready'"></h3><p x-text="$store.convoStudio.blocked ? 'Stop Convo before opening the profile editor or preview. Your response voice is preserved.' : 'The original Studio needs its approved Gradio dependency in the Convo-owned gateway. Nothing is installed, downloaded or loaded by opening this page.'"></p><button class="btn" @click="$store.convoStudio.retry()">Check again</button></div></template>
</section></template></div>
<style>
.convo-studio-shell{padding:1rem;width:100%;min-width:0;box-sizing:border-box}.convo-studio-shell header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}.convo-studio-shell h2{margin:.25rem 0}.convo-studio-selection{display:flex;align-items:end;gap:.6rem;flex-wrap:wrap}.convo-studio-selection label{display:grid;gap:.4rem;flex:1;min-width:12rem}.convo-studio-selection select{width:100%;min-height:2.5rem}.convo-studio-frame{display:block;width:100%;height:72vh;min-height:480px;border:1px solid var(--color-border,#666);border-radius:12px;background:#fff7ed}.convo-studio-unavailable{padding:2rem;border:1px solid var(--color-border,#666);border-radius:12px}.convo-studio-shell [role=alert]{color:var(--color-error,#db5959)}
</style></body></html>
